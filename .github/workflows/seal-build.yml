name: seal-build

# Upstream Apache CXF 3.2.4 ships no GitHub Actions CI; this workflow mirrors
# BUILDING.txt (mvn install on JDK 8) scoped to the cxf-rt-transports-http
# module, its unit tests, and the systests that exercise its code paths.
# Upstream's default-profile checkstyle, PMD and enforcer checks stay enabled.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAVEN_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m"
      # Release-only attachments (javadoc/sources jars, signatures, RAT report);
      # none of them is part of the cxf-rt-transports-http jar we ship.
      RELEASE_SKIPS: "-Dmaven.javadoc.skip=true -Dsource.skip=true -Dgpg.skip=true -Drat.skip=true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.9.5
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.5/binaries/apache-maven-3.9.5-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.5/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          java -version
          mvn -version

      # -Dinvoker.skip: -am pulls in cxf-codegen-plugin, whose invoker IT
      # "jdk6-cxf-with-toolchain" needs a JDK 6 toolchain that is not installed.
      - name: Install reactor dependencies (module + systests)
        run: |
          mvn -B -ntp clean install \
            -pl rt/transports/http,systests/transports,systests/jaxrs,systests/ws-specs -am \
            -DskipTests -Dinvoker.skip=true $RELEASE_SKIPS

      # The shipped jar is rebuilt on its own (no reactor) and tested here.
      # OSGI_IMPORT = this module's own <cxf.osgi.import> with its properties
      # resolved, plus one entry: org.apache.cxf.wsdl;version="[3.2,4)".
      # bnd 2.4.1 takes the first classpath jar holding a package; cxf-core
      # (declared first) holds the empty parent dir of org.apache.cxf.wsdl.http,
      # so the cxf-rt-wsdl export version is lost. The 3.2.4 release jar carries
      # that range (3.2.3/3.2.5 do not); this reproduces the published manifest.
      # A -D override changes no file shipped in the jar (its pom.xml stays as-is).
      - name: Build and test cxf-rt-transports-http (module suite)
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          OSGI_IMPORT: 'javax.net,javax.servlet*;version="[0.0,4.1)",org.apache.aries*;version="[1.0,2)";resolution:=optional,org.springframework*;resolution:="optional";version="[3.1,5)",org.osgi.service.http,org.apache.cxf.wsdl;version="[3.2,4)";resolution:=optional'
        run: |
          if [ -n "$TEST_FILTER" ]; then
            mvn -B -ntp clean install -pl rt/transports/http "-Dcxf.osgi.import=$OSGI_IMPORT" -Dtest="$TEST_FILTER" \
              -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false $RELEASE_SKIPS
          else
            mvn -B -ntp clean install -pl rt/transports/http "-Dcxf.osgi.import=$OSGI_IMPORT" $RELEASE_SKIPS
          fi

      - name: Show OSGi Import-Package of the built jar
        run: |
          jar=$(find rt/transports/http/target -maxdepth 1 -name 'cxf-rt-transports-http-*.jar' ! -name '*-tests.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          echo "jar: $jar"
          unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | sed -e ':a;N;$!ba;s/\n //g' | grep '^Import-Package' > "$RUNNER_TEMP/imports.txt"
          tr ',' '\n' < "$RUNNER_TEMP/imports.txt" | grep -A1 'org.apache.cxf.wsdl'
          grep -q 'org.apache.cxf.wsdl;version="\[3.2,4)";resolution:=optional' "$RUNNER_TEMP/imports.txt"

      - name: Systests - HTTPS hostname verification (transports)
        env:
          TEST_FILTER: ${{ inputs.test-filter || 'org.apache.cxf.systest.https.hostname.*Test' }}
        run: |
          mvn -B -ntp test -pl systests/transports -Dtest="$TEST_FILTER" \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false $RELEASE_SKIPS

      - name: Systests - JAX-RS Spring servlet / service listing (jaxrs)
        env:
          TEST_FILTER: ${{ inputs.test-filter || 'JAXRSClientServerSpringBookTest,JAXRSServicesListingTest' }}
        run: |
          mvn -B -ntp test -pl systests/jaxrs -Dtest="$TEST_FILTER" \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false $RELEASE_SKIPS

      - name: Systests - JAX-WS service listing (ws-specs)
        env:
          TEST_FILTER: ${{ inputs.test-filter || 'JAXWSServicesListingTest' }}
        run: |
          mvn -B -ntp test -pl systests/ws-specs -Dtest="$TEST_FILTER" \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false $RELEASE_SKIPS

      - name: Report test totals and skipped tests with reasons
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, xml.etree.ElementTree as ET
          total = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for f in sorted(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)):
              root = ET.parse(f).getroot()
              for k in total:
                  total[k] += int(root.get(k, 0))
              for tc in root.iter("testcase"):
                  sk = tc.find("skipped")
                  if sk is None:
                      continue
                  cls, name = tc.get("classname"), tc.get("name")
                  reason = sk.get("message") or ""
                  if not reason:
                      for src in glob.glob("**/src/test/java/" + cls.replace(".", "/") + ".java", recursive=True):
                          text = open(src, encoding="utf-8", errors="replace").read()
                          m = re.search(r"(@(?:org\.junit\.)?Ignore[^\n]*)\s*(?:\n\s*@[^\n]*)*\n\s*public void " + re.escape(name) + r"\b", text)
                          if m:
                              reason = "upstream annotation in source: " + m.group(1).strip()
                  print(f"SKIPPED {cls}.{name}: {reason or 'no reason given by runner'}")
          print("SUREFIRE TOTAL:", total, "passed =", total["tests"] - total["failures"] - total["errors"] - total["skipped"])
          EOF

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cxf-rt-transports-http
          path: |
            rt/transports/http/target/cxf-rt-transports-http-*.jar
            !rt/transports/http/target/cxf-rt-transports-http-*-tests.jar
            !rt/transports/http/target/cxf-rt-transports-http-*-sources.jar
            !rt/transports/http/target/cxf-rt-transports-http-*-javadoc.jar
          if-no-files-found: error
